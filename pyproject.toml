[project]
name = "contextpacker"
version = "3.1.0"
description = "A desktop app to scrape websites, Git repositories, or package local files into a single file, optimized for consumption by LLMs."
authors = [{ name = "dcog989", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "beautifulsoup4>=4.14.2,<5.0.0",
    "lxml>=6.0.2,<7.0.0",
    "markdownify>=1.2.0,<2.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pyside6>=6.10.0,<7.0.0",
    "repomix>=0.5.0,<0.6.0",
    "requests>=2.32.5,<3.0.0",
]

[project.scripts]
contextpacker = "app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0,<7.0.0",
    "nox>=2026.4.10,<2027.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "ui"]

[tool.ruff]
line-length = 120
