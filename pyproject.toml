[project]
name = "contextpacker"
version = "3.3.0"
description = "A desktop app to scrape websites, Git repositories, or package local files into a single file, optimized for consumption by LLMs."
authors = [{ name = "dcog989", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15",
    "lxml>=6.1",
    "markdownify>=1.2",
    "pydantic>=2.13",
    "pyside6>=6.11",
    "repomix>=0.5",
    "requests>=2.34",
]

[project.scripts]
contextpacker = "app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.21",
    "nox>=2026.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "ui"]

[tool.ruff]
line-length = 120
